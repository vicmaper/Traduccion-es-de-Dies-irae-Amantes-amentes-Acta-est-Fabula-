name: Compilar kit para Windows
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install pyinstaller numpy
      - name: Compilar
        run: >
          pyinstaller --onefile --windowed --name DiesIrae_ES
          --add-data "kit/datos;datos"
          --add-data "kit/malie_claves_todas.json;."
          --paths kit --hidden-import di_gui
          kit/di_kit.py
      - uses: actions/upload-artifact@v4
        with:
          name: DiesIrae_ES
          path: dist/DiesIrae_ES.exe
      - name: Publicar en Releases
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/DiesIrae_ES.exe
